services:
  web:
    image: us_paper_cup_web:latest
    build:
      context: .
      args:
        - NEXT_PUBLIC_Stripe_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
        - AUTH_SECRET=${AUTH_SECRET}
        - AUTH_URL=https://uspapercupfactory.com
        - AUTH_TRUST_HOST=true
        - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-G-710WV4W9JS}
        - DATABASE_URL=file:./prisma/dev.db
    restart: always
    volumes:
      - uploads_data:/app/public/uploads
      - db_data:/app/prisma
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_Stripe_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=https://uspapercupfactory.com
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - AUTH_TRUST_HOST=true
      - DATABASE_URL=file:./prisma/dev.db
    networks:
      - default

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - uploads_data:/uploaded_files
      - ./public:/app_public
    depends_on:
      - web
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.us-paper-cup-caddy.rule=Host(`uspapercupfactory.com`) || Host(`www.uspapercupfactory.com`)
      - traefik.http.routers.us-paper-cup-caddy.entrypoints=http,https
      - traefik.http.routers.us-paper-cup-caddy.tls=true
      - traefik.http.routers.us-paper-cup-caddy.tls.certresolver=letsencrypt
      - traefik.http.services.us-paper-cup-caddy.loadbalancer.server.port=80

networks:
  coolify:
    external: true
  default:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  uploads_data:
  db_data:
